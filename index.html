<html>
    <head>
        <title>AI Reply with the Chat</title>
        <link rel="stylesheet" href="/src/styles.css">
        <script type="module" src="/src/foreground.ts"></script>
    </head>
    <body>
        <div>
            <p>Email: <i id="subject"></i></p>
            <p>Sender: <i id="sender"></i></p>
            <p id="displayRaw">Plain mail text not available. Display raw email.</p>
        </div>
        <div>
            <textarea id="email" name="email" rows="4" required></textarea>
        </div>
        <div>
            <label for="prompt">Prompt</label>
            <textarea id="prompt" name="prompt" rows="4" required></textarea>
        </div>
        <div>
            <button id="generateReplyButton">Generate Reply</button>
        </div>
    </body>
</html>
